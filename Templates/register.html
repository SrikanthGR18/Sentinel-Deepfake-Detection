<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register | Sentinel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .bg-grid {
            background-size: 40px 40px;
            background-image: linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        }
    </style>
</head>
<body class="bg-blue-950 flex items-center justify-center min-h-screen relative overflow-hidden">

    <div class="absolute inset-0 bg-grid z-0 pointer-events-none"></div>
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-yellow-500/15 blur-[120px] rounded-full z-0 pointer-events-none"></div>

    <div class="relative z-10 max-w-md w-full bg-blue-900/80 backdrop-blur-xl p-10 rounded-2xl shadow-2xl border border-blue-800 mx-4">
        <div class="text-center mb-8">
            <h2 class="text-3xl font-black text-white tracking-tight uppercase">System Registration</h2>
            <p class="text-sm text-blue-300 mt-2 font-medium">Create a forensic researcher account</p>
        </div>

        {% with messages = get_flashed_messages(category_filter=["error"]) %}
            {% if messages %}
                <div class="mb-6 p-4 rounded-lg bg-rose-500/10 text-rose-400 border border-rose-500/30 text-sm font-bold">
                    {{ messages[0] }}
                </div>
            {% endif %}
        {% endwith %}

        <form method="POST" class="space-y-5">
            <div>
                <label class="block text-xs uppercase tracking-widest text-blue-300 font-bold mb-2">Desired ID</label>
                <input type="text" name="username" required 
                       class="w-full bg-blue-950/80 border border-blue-800 text-white px-4 py-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-yellow-500/50 focus:border-yellow-500 transition-all placeholder-blue-700 font-medium" placeholder="New username">
            </div>
            <div>
                <label class="block text-xs uppercase tracking-widest text-blue-300 font-bold mb-2">Secure Passkey</label>
                <input type="password" name="password" required 
                       class="w-full bg-blue-950/80 border border-blue-800 text-white px-4 py-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-yellow-500/50 focus:border-yellow-500 transition-all placeholder-blue-700 font-medium" placeholder="••••••••">
            </div>
            <button type="submit" class="w-full bg-blue-800 border border-blue-700 hover:border-yellow-500/50 text-white font-bold py-3.5 rounded-lg shadow-lg hover:shadow-yellow-500/10 hover:text-yellow-400 transition-all duration-200 mt-2 uppercase tracking-wide">
                Initialize Account
            </button>
        </form>

        <p class="mt-8 text-center text-sm text-blue-400 font-medium">
            Already registered? <a href="/login" class="text-yellow-400 hover:text-yellow-300 font-bold transition-colors">Log in</a>
        </p>
    </div>

</body>
</html>
